name: ignition-outbound

services:
  database:
    image: ${PARADEDB_IMAGE:-paradedb/paradedb:v0.23.5}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ignition_outbound}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - paradedb-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ignition_outbound}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [outbound-private]

  tei-embedding:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9-grpc@sha256:10a79d66b4f49bd35fe7f61af8b1e3cefe007e36b7f87b11bb58908bb5906301}
    platform: linux/amd64
    command:
      - --model-id
      - ${TEI_EMBEDDING_RUNTIME_MODEL_ID:-janni-t/qwen3-embedding-0.6b-int8-tei-onnx}
      - --revision
      - ${TEI_EMBEDDING_RUNTIME_MODEL_SHA:-8fe0c238c7c48016d28e750413ca492024be3ddf}
      - --pooling
      - last-token
      - --auto-truncate
      - --tokenization-workers
      - "1"
      - --max-batch-tokens
      - ${TEI_EMBEDDING_MAX_BATCH_TOKENS:-1024}
      - --max-concurrent-requests
      - ${TEI_EMBEDDING_MAX_CONCURRENT_REQUESTS:-1}
      - --max-client-batch-size
      - ${TEI_EMBEDDING_MAX_CLIENT_BATCH_SIZE:-32}
    ports:
      - "127.0.0.1:${TEI_EMBEDDING_HOST_PORT:-8081}:80"
    volumes:
      - tei-model-cache:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/80'"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 20
    restart: unless-stopped
    networks: [outbound-private]

  tei-reranker:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9-grpc@sha256:10a79d66b4f49bd35fe7f61af8b1e3cefe007e36b7f87b11bb58908bb5906301}
    platform: linux/amd64
    command:
      - --model-id
      - ${TEI_RERANKER_RUNTIME_MODEL_ID:-csylabs/bge-reranker-v2-m3-int8-onnx}
      - --revision
      - ${TEI_RERANKER_RUNTIME_MODEL_SHA:-eaf5072d7b1a3f1fa584cc7482c7efb8f784dca0}
      - --auto-truncate
      - --tokenization-workers
      - "1"
      - --max-batch-tokens
      - ${TEI_RERANKER_MAX_BATCH_TOKENS:-1024}
      - --max-concurrent-requests
      - ${TEI_RERANKER_MAX_CONCURRENT_REQUESTS:-1}
    ports:
      - "127.0.0.1:${TEI_RERANKER_HOST_PORT:-8082}:80"
    volumes:
      - tei-model-cache:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/80'"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 20
    restart: unless-stopped
    networks: [outbound-private]

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-07-23T15-54-02Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [outbound-private]

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        && mc mb --ignore-existing "local/$$S3_BUCKET"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-ignition-outbound}
    networks: [outbound-private]

  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:2026.8.16-b2da6b90f}
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET is required}
    volumes:
      - ./apps/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [outbound-private]

  crawler:
    build:
      context: ./apps/crawler
    depends_on:
      searxng:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      CRAWLER_API_KEY: ${CRAWLER_API_KEY:?CRAWLER_API_KEY is required}
      SEARXNG_URL: http://searxng:8080
      SEARCH_FALLBACK_ENABLED: ${SEARCH_FALLBACK_ENABLED:-true}
      ALLOW_PRIVATE_NETWORKS: "false"
      MAX_CONCURRENT_CRAWLS: 4
      MAX_CONCURRENT_PER_DOMAIN: 2
      MAX_CRAWL_LIMIT: 300
      RESPECT_ROBOTS_TXT: "true"
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 20s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [outbound-private]

volumes:
  paradedb-data:
  minio-data:
  tei-model-cache:

networks:
  outbound-private:
    driver: bridge
