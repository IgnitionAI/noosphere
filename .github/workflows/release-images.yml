name: Release images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a release commit from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require the Check workflow to be green on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?head_sha=$GITHUB_SHA&per_page=20" \
            --jq '.workflow_runs | map(select(.conclusion == "success")) | first | .conclusion')"
          if [[ "$conclusion" != "success" ]]; then
            echo "The Check workflow is not green for $GITHUB_SHA (conclusion: ${conclusion:-missing})" >&2
            exit 1
          fi

  build-scan-push:
    needs: verify-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: Dockerfile.backend
          - name: web
            context: .
            dockerfile: Dockerfile.web
          - name: crawler
            context: apps/crawler
            dockerfile: apps/crawler/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve fork-safe image coordinates
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA:0:12}"
          image="ghcr.io/${owner}/noosphere-${{ matrix.name }}"
          {
            echo "name=$image"
            echo "version_tag=$image:$GITHUB_REF_NAME"
            echo "sha_tag=$image:sha-$short_sha"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.name }} image for AMD64
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.version_tag }}
            ${{ steps.image.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.title=Noosphere ${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan runtime image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.67.2 image --exit-code 1 --severity CRITICAL,HIGH
          --ignore-unfixed ${{ steps.image.outputs.version_tag }}
      - name: Push SemVer and commit tags
        run: |
          docker push "${{ steps.image.outputs.version_tag }}"
          docker push "${{ steps.image.outputs.sha_tag }}"
      - name: Resolve published digest
        id: digest
        run: |
          digest="$(docker buildx imagetools inspect "${{ steps.image.outputs.version_tag }}" --format '{{.Manifest.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Published digest is invalid: $digest" >&2
            exit 1
          fi
          echo "value=$digest" >> "$GITHUB_OUTPUT"
      - name: Generate build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true
      - name: Verify published image can be downloaded
        shell: bash
        run: |
          exact="${{ steps.image.outputs.name }}@${{ steps.digest.outputs.value }}"
          if [[ "${{ github.event.repository.private }}" == "false" ]]; then
            anonymous_config="$(mktemp -d)"
            trap 'rm -rf "$anonymous_config"' EXIT
            if ! DOCKER_CONFIG="$anonymous_config" docker pull "$exact"; then
              echo "Public repositories must expose public GHCR packages for anonymous quickstart installs." >&2
              echo "Open the package settings, set visibility to Public, then re-run this workflow." >&2
              exit 1
            fi
          else
            docker pull "$exact"
          fi
          runtime_user="$(docker image inspect "$exact" --format '{{.Config.User}}')"
          runtime_architecture="$(docker image inspect "$exact" --format '{{.Architecture}}')"
          printf 'user=%s\narchitecture=%s\n' "$runtime_user" "$runtime_architecture" | tee image-runtime.txt
          if [[ -z "$runtime_user" || "$runtime_user" == "0" || "$runtime_user" == "root" || "$runtime_user" == 0:* ]]; then
            echo "Runtime image must declare a non-root user" >&2
            exit 1
          fi
          [[ "$runtime_architecture" == "amd64" ]]
      - name: Archive release evidence
        run: |
          mkdir -p release-evidence
          printf '%s\n' \
            "image=${{ steps.image.outputs.name }}" \
            "version=${{ github.ref_name }}" \
            "commit=${{ github.sha }}" \
            "digest=${{ steps.digest.outputs.value }}" \
            "source=https://github.com/${{ github.repository }}" \
            > "release-evidence/${{ matrix.name }}.txt"
          mv image-runtime.txt "release-evidence/${{ matrix.name }}-runtime.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: noosphere-${{ matrix.name }}-${{ github.ref_name }}
          path: release-evidence/
          if-no-files-found: error
