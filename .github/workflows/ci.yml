name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ignition_outbound_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ignition_outbound_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify repository
        run: bun run check
      - name: Verify PostgreSQL foundation
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ignition_outbound_test
        run: bun run test:integration
