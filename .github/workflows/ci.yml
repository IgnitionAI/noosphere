name: CI (legacy manual entrypoint)

# The branch and pull-request automation lives in check.yml. Keep this file as
# a manual escape hatch for links/bookmarks to the old CI workflow, without
# running a second, incomplete check on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Use the Check workflow
        run: echo "Run the Check workflow for the supported dev -> main flow."
