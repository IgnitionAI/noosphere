name: Check

on:
  push:
    branches:
      - dev
      - preprod
      - prod
  pull_request:
    branches:
      - dev
      - preprod
      - prod

permissions:
  contents: read

env:
  # CI-only values. They are intentionally non-secret and never used against
  # external providers or production services.
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ignition_outbound_test
  # Integration tests create/migrate their own database and must not share the
  # database used by the repository migration check above.
  TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ignition_outbound_integration_test
  OPENAI_API_KEY: ci-test-openai-key
  OPENAI_RESEARCH_MODEL: ci-test-research-model
  OPENAI_SYNTHESIS_MODEL: ci-test-synthesis-model
  OPENAI_EMBEDDING_MODEL: text-embedding-3-small
  AI_PROVIDER: openai
  BETTER_AUTH_URL: http://127.0.0.1:3000
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-012345678901234567890123
  BETTER_AUTH_TRUSTED_ORIGINS: http://127.0.0.1:3000
  BETTER_AUTH_ALLOW_SIGN_UP: "false"
  OUTBOUND_API_URL: http://127.0.0.1:3001
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_REGION: us-east-1
  S3_BUCKET: ignition-outbound-ci
  S3_ACCESS_KEY_ID: ci-access-key
  S3_SECRET_ACCESS_KEY: ci-secret-key
  DOCLING_SERVICE_URL: http://127.0.0.1:5001
  CRAWLER_SERVICE_URL: http://127.0.0.1:8000
  SEARCH_FALLBACK_ENABLED: "true"
  PORT: "3001"

jobs:
  check:
    name: bun run check
    runs-on: ubuntu-latest
    services:
      database:
        image: paradedb/paradedb:v0.23.5
        env:
          POSTGRES_DB: ignition_outbound_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ignition_outbound_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/crawler/uv.lock

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/crawler/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/crawler
        run: uv run playwright install --with-deps chromium

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Run repository checks
        run: bun run check

      - name: Run PostgreSQL integration tests
        run: bun run test:integration
