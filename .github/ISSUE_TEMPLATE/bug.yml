name: Bug
description: Signaler un défaut reproductible
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Comportement observé
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Preuves
      description: Captures, logs expurgés ou environnement concerné.
