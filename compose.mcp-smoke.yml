# Local-only A4 harness. Never use this file for production deployment.
# It publishes Caddy on loopback only and deliberately does not publish API,
# database, object storage, crawler, search, or embedding ports.
services:
  proxy:
    environment:
      PUBLIC_HOST: ${MCP_SMOKE_HOST:-mcp-smoke.localhost}
    ports: !override
      - "127.0.0.1:${MCP_SMOKE_HTTP_PORT:-18080}:80"
      - "127.0.0.1:${MCP_SMOKE_HTTPS_PORT:-18443}:443"
    volumes:
      - ./deploy/Caddyfile.mcp-smoke:/etc/caddy/Caddyfile:ro

  api:
    environment:
      BETTER_AUTH_URL: https://${MCP_SMOKE_HOST:-mcp-smoke.localhost}:${MCP_SMOKE_HTTPS_PORT:-18443}
      BETTER_AUTH_TRUSTED_ORIGINS: https://${MCP_SMOKE_HOST:-mcp-smoke.localhost}:${MCP_SMOKE_HTTPS_PORT:-18443}
      MCP_ALLOWED_HOSTS: ${MCP_SMOKE_HOST:-mcp-smoke.localhost}:${MCP_SMOKE_HTTPS_PORT:-18443}
      MCP_ALLOWED_ORIGINS: https://${MCP_SMOKE_HOST:-mcp-smoke.localhost}:${MCP_SMOKE_HTTPS_PORT:-18443}

  # Run only on demand after the private database has migrated. The generated
  # bearer values stay in the container's private filesystem and are copied
  # out by the runbook as a tar stream, never through a bind mount or image.
  mcp-smoke-seeder:
    image: ${BACKEND_IMAGE:-${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-ignitionai}/${IMAGE_PREFIX:-noosphere}-backend:${APP_VERSION:-dev}}
    entrypoint: ["bun", "/app/dist/mcp-smoke/prepare-mcp-production-smoke.js"]
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      SMOKE_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@database:5432/${POSTGRES_DB:-ignition_outbound}
      MCP_SMOKE_ENV_FILE: /tmp/mcp-smoke-private/mcp-smoke.env
      MCP_SMOKE_FIXTURE_KEY: ${MCP_SMOKE_FIXTURE_KEY:-a4-manual}
      MCP_SMOKE_HOST: ${MCP_SMOKE_HOST:-mcp-smoke.localhost}
      MCP_SMOKE_HTTPS_PORT: ${MCP_SMOKE_HTTPS_PORT:-18443}
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [mcp-smoke]
    networks: [outbound-private]
